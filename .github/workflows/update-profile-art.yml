name: Update profile art

# Refreshes the animated contribution heatmap from live GitHub data (includes private contributions).

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contribution data
        env:
          GH_PROFILE_USER: Jadessz
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/generate_heatmap_svg.py Jadessz contrib-heatmap.svg

      - name: Render stats, languages and streak cards
        env:
          # Classic PAT with `repo` + `read:user` so private repos are counted
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_stats_svgs.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats-card.svg top-langs-card.svg streak-card.svg"
